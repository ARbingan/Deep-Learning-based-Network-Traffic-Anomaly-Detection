# Transformer异常检测器配置文件

# 模型架构参数
model:
  feature_dim: 32          # 输入特征维度
  d_model: 64              # Transformer隐藏维度（建议：64-128）
  nhead: 4                 # 注意力头数（建议：2-8）
  num_layers: 2            # Transformer编码器层数（建议：1-3）
  dim_feedforward: 128     # 前馈网络维度（建议：d_model*2）
  seq_len: 10              # 输入序列长度（时间窗口数）
  dropout: 0.1             # Dropout率

# 训练参数
training:
  batch_size: 32           # 批次大小（根据显存调整，RTX 3050建议16-32）
  epochs: 50               # 训练轮数
  lr: 0.001                # 学习率
  weight_decay: 0.0001     # 权重衰减（L2正则）
  val_split: 0.2           # 验证集比例
  test_split: 0.1          # 测试集比例
  stride: 1                # 序列滑动步长
  lr_patience: 5           # 学习率调整耐心值
  log_interval: 5          # 日志打印间隔（每N轮）

# 数据处理
data:
  use_synthetic: false     # 是否使用合成数据（真实数据不足时）
  synthetic_samples: 5000  # 合成数据样本数
  anomaly_ratio: 0.1       # 异常样本比例（合成数据）
  use_rule_labels: true    # 使用规则检测生成伪标签
  normalize: true          # 是否标准化特征

# 推理参数
inference:
  threshold: 0.5           # 异常判定阈值（0-1）
  device: "cuda"          # 推理设备：'cuda'或'cpu'

# 路径配置
paths:
  model_save: "models/transformer_detector.pth"
  db_path: "data/traffic_analyzer.db"
  log_path: "logs/transformer_training.log"

# 注意事项：
# 1. 参数量估算公式：
#    Total ≈ (feature_dim * d_model + d_model) +                    # input_proj
#            (num_layers * (d_model * d_model * 4 + ...)) +        # transformer layers
#            (d_model * (d_model//2) + (d_model//2) * 1)           # classifier
#    当前配置约：~85K参数（<100K目标）
#
# 2. RTX 3050 4/6GB显存建议：
#    - batch_size: 16-32
#    - d_model: 64-128
#    - num_layers: 1-2
#
# 3. 如果显存不足，可以：
#    - 减小 batch_size
#    - 减小 d_model
#    - 减少 num_layers
#    - 使用 CPU 推理（device: "cpu"）